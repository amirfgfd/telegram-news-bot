name: News Bot

on:
  schedule:
    - cron: "1 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bot
        run: python bot.py

      - name: Save sent list
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add sent.json
          if ! git diff --staged --quiet; then
            git commit -m "update sent list"
            git push
          fi
